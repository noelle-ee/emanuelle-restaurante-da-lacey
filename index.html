<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante Da Lacey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo-container">
        <div class="logo">
            <h1>Sabor & Arte</h1>
        </div>
        <div class="imagem-topo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRGe6TwiI1DfNcXXBRj7AfrdPRcurVFNQjFy52TUnz9tmL1Js3Y5WrsJU&s=10">
        </div>
    </header>

    <main class="menu-container">
        <h2>Cardápio e Informações</h2>

        <details>
            <summary>🍔 Lanches e Hambúrgueres</summary>

            <div class="opcao-conteudo">
                <p><strong>Hambúrguer Artesanal</strong> - R$ 32,00</p>
                <p>Carne 180g, queijo e salada.</p>
                <button>Adicionar ao Carrinho</button>
            </div>

        </details>

        <details>
            <summary>🍕 Pizzas</summary>

            <div class="opcao-conteudo">
                <p><strong>Pizza Margherita</strong> - R$ 45,00</p>
                <p>Molho, muçarela e manjericão.</p>
                <button>Adicionar ao Carrinho</button>
            </div>

        </details>

        <details>
            <summary>🥤 Bebidas</summary>

            <div class="opcao-conteudo">
                <p><strong>Suco Natural</strong> - R$ 10,00</p>
                <button>Adicionar ao Carrinho</button>
            </div>

        </details>
    </main>

</body>
</html>
